# check available option strings at https://github.com/macmpi/xg_multi
DEV_MAC=""    # option with -D for device MAC address in hex form
HOST_MAC=""	 # option with -H for host MAC address in hex form
VOLUME=""    # option with -V for path for device or LUN file
WAIT=""       # option with -w for polling interval in seconds

XG_MULTI_OPTS="$DEV_MAC $HOST_MAC $VOLUME $WAIT"
